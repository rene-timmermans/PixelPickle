# Runs the full test suite from tests/ (without a screen) on Arch and Fedora:
# on every push to main, on pull requests, by hand, and from the release workflow
# (the packages are only attached to a release once all tests have passed).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch
            image: archlinux:latest
            setup: pacman -Syu --noconfirm --needed pyside6 python-numpy python-pillow ttf-dejavu qt6-translations
          - name: Fedora
            image: fedora:latest
            setup: dnf install -y python3-pyside6 python3-numpy python3-pillow dejavu-sans-fonts qt6-qttranslations findutils
    name: Tests (${{ matrix.name }})
    container: ${{ matrix.image }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Benodigdheden installeren
        run: ${{ matrix.setup }}
      - name: Alle tests
        run: sh tools/run_tests.sh python3
